[project]
name = "ai-station-runner"
version = "0.1.0"
description = "Native host runner for AI Station"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "av>=19,<20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_station_runner*"]

[tool.setuptools.package-data]
ai_station_runner = ["recipes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
