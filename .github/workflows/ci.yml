name: CI
on:
  # Manual only. Ordinary checks retain owner-approved local verification.
  workflow_dispatch:
    inputs:
      operation:
        description: Run checks or prepare the owner-reviewed release PR
        type: choice
        default: checks
        options:
          - checks
          - release-pr
          - macos-native-checks
          - macos-native-inference
          - macos-desktop-transport
          - macos-native-ui-checks
          - macos-consumer-backend
permissions:
  contents: read
jobs:
  python:
    if: inputs.operation == 'checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.lock
      - run: .venv/bin/pip install --no-deps -e backend -e host-runner
      - run: ./scripts/check.sh
  windows-contracts:
    if: inputs.operation == 'checks'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows PowerShell lifecycle contracts
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) { throw 'Use native Windows PowerShell 5.1 for these contracts.' }
          & ./packaging/windows/tests/StartupFailure.Tests.ps1
          & ./packaging/windows/tests/DesktopProcess.Tests.ps1
          & ./packaging/windows/tests/UpdateCoordinator.Tests.ps1
          & ./packaging/windows/tests/GuestUpdate.Tests.ps1
  frontend:
    if: inputs.operation == 'checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
  docker:
    if: inputs.operation == 'checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker build -t ai-station:ci .
      - run: docker build -f python-executor/Dockerfile -t ai-station-python:ci .
  macos-native:
    # Only standard free PUBLIC runners. Never allocate paid/private/larger hosts.
    if: (inputs.operation == 'macos-native-checks' || inputs.operation == 'macos-native-inference') && github.event.repository.private == false && github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: backend:host-runner:scripts
      AI_STATION_REAL_MAC_PROCESS_TESTS: '1'
      AI_STATION_REAL_MAC_TELEMETRY_TESTS: '1'
      AI_STATION_REAL_MAC_METAL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe actual ordinary-user hypervisor availability
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -m 700 .native-mac
          mkdir -m 700 .native-mac/hypervisor-probe
          /usr/bin/xcrun clang -Wall -Wextra -Werror -framework Hypervisor \
            packaging/macos/hypervisor-probe.c -o .native-mac/hypervisor-probe/check
          /usr/bin/codesign --force --sign - \
            --entitlements packaging/macos/hypervisor-probe.entitlements .native-mac/hypervisor-probe/check
          /usr/bin/codesign --verify --strict .native-mac/hypervisor-probe/check
          /usr/bin/codesign --display --entitlements - .native-mac/hypervisor-probe/check
          /usr/bin/sw_vers -productVersion
          .native-mac/hypervisor-probe/check | tee .native-mac/hypervisor-probe/result.json
      - name: Install checked developer dependencies and native package tool
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r packaging/macos/checks.lock
          .venv/bin/python -m pip install --require-hashes -r packaging/macos/build-tools.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Exercise actual native kernel ownership and observations
        run: |
          .venv/bin/python -m pytest -q -W error::pytest.PytestUnhandledThreadExceptionWarning \
            host-runner/tests/test_darwin_process_identity.py \
            host-runner/tests/test_darwin_processes.py \
            host-runner/tests/test_runner_platform.py \
            host-runner/tests/test_darwin_telemetry.py \
            host-runner/tests/test_darwin_metal.py
      - name: Exercise desktop routing with neutral local CLI processes
        run: |
          # These component tests use no database. Keep backend migration
          # conftest out of the deliberately native-only dependency environment.
          .venv/bin/python -m pytest -q --noconftest \
            backend/tests/test_desktop_engine.py \
            backend/tests/test_desktop_control.py \
            backend/tests/test_desktop_versions.py \
            backend/tests/test_desktop_update_owner.py \
            backend/tests/test_desktop_upgrade_image.py \
            backend/tests/test_desktop_update.py \
            backend/tests/test_desktop_native_storage.py \
            backend/tests/test_desktop_database_storage.py \
            backend/tests/test_desktop_restore_owner.py \
            backend/tests/test_desktop_restore_files.py \
            backend/tests/test_desktop_restoration.py \
            backend/tests/test_desktop_backup_ui.py \
            backend/tests/test_desktop_restore_authority.py \
            backend/tests/test_macos_desktop_ui.py \
            backend/tests/test_desktop_database_fingerprint.py \
            backend/tests/test_desktop_snapshot.py \
            backend/tests/test_desktop_snapshot_files.py \
            backend/tests/test_desktop_snapshots.py \
            backend/tests/test_macos_desktop_docker.py \
            backend/tests/test_macos_desktop_prerequisites.py \
            backend/tests/test_desktop_bridge.py \
            backend/tests/test_desktop_link.py \
            backend/tests/test_desktop_connection.py \
            backend/tests/test_macos_runner_link.py \
            backend/tests/test_macos_transport_probe.py
      - name: Assemble fixed native Python layer
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir -m 700 .native-mac/inputs
          .venv/bin/python scripts/macos_desktop_python.py \
            --architecture "$TARGET_ARCHITECTURE" --cache "$PWD/.native-mac/inputs" \
            --output "$PWD/.native-mac/python" --download-inputs
      - name: Assemble regular installed Host Runner layer
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          .venv/bin/python scripts/macos_application_python.py \
            --architecture "$TARGET_ARCHITECTURE" --python-layer "$PWD/.native-mac/python" \
            --output "$PWD/.native-mac/application-python"
      - name: Execute installed Runner with exact bundled interpreter
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: .native-mac/application-python/bin/python3.12 -IB scripts/macos_application_probe.py "$TARGET_ARCHITECTURE"
      - name: Exercise native SDK preparation through installed Runner
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [ "${{ inputs.operation }}" = "macos-native-inference" ]; then
            .native-mac/application-python/bin/python3.12 -IB scripts/macos_sdk_preparation_probe.py "$TARGET_ARCHITECTURE" --run-native-inference
          else
            .native-mac/application-python/bin/python3.12 -IB scripts/macos_sdk_preparation_probe.py "$TARGET_ARCHITECTURE"
          fi
      - name: Compile and exercise native presentation and desktop storage
        timeout-minutes: 3
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          .venv/bin/python scripts/build_macos_native.py \
            --architecture "$TARGET_ARCHITECTURE" --output "$PWD/.native-mac/native-interface"
          .native-mac/native-interface/ai-station-native --native-ui-smoke
          .native-mac/native-interface/ai-station-native --native-update-smoke
          .native-mac/native-interface/ai-station-native --native-backup-smoke
          .native-mac/native-interface/ai-station-native --native-backup-progress-smoke
          .native-mac/native-interface/ai-station-native --native-admin-recovery-smoke
          .native-mac/native-interface/ai-station-native --native-update-ownership-smoke
          .native-mac/application-python/bin/python3.12 -IB scripts/macos_desktop_storage_probe.py
      - name: Exercise actual application bundle entry with neutral image fixture
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: .native-mac/application-python/bin/python3.12 -IB scripts/macos_bundle_probe.py "$TARGET_ARCHITECTURE"
      - name: Execute the actual bundled interpreter and native dependencies
        if: inputs.operation == 'macos-native-checks'
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: .native-mac/python/bin/python3.12 -IB scripts/macos_package_import_probe.py "$TARGET_ARCHITECTURE"
      - name: Explicit fixed-model CPU inference and owned Stop
        if: inputs.operation == 'macos-native-inference'
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: .native-mac/python/bin/python3.12 -IB scripts/macos_package_import_probe.py "$TARGET_ARCHITECTURE" --run-native-inference
  macos-consumer-backend:
    # Explicit real 4B CPU model on a fresh PUBLIC standard-free Intel host.
    if: inputs.operation == 'macos-consumer-backend' && github.event.repository.private == false && github.actor == github.repository_owner && github.repository == 'jahu/ai-station'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      AI_STATION_REAL_MAC_DOCKER_TESTS: '1'
      AI_STATION_REAL_MAC_CONSUMER_TESTS: '1'
      PYTHONPATH: backend:host-runner:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned developer build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r packaging/macos/checks.lock
          .venv/bin/python -m pip install --require-hashes -r packaging/macos/build-tools.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # Exercise the actual isolated producer imports before installing
          # Docker or spending time assembling layers and an application image.
          .venv/bin/python -IB -c 'import sys; sys.path.insert(0, "scripts"); from macos_consumer_probe import producer; producer()'
      - name: Fresh Docker Desktop and actual package backend
        run: bash scripts/macos_docker_desktop_qa.sh --consumer
      - name: Report bounded non-secret experiment status
        if: always()
        run: |
          if [ -f .tools/mac-consumer-experiment/result.json ]; then
            cat .tools/mac-consumer-experiment/result.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = Path('.tools/mac-consumer-experiment/image/build.json')
          if receipt.is_file():
              value = json.loads(receipt.read_text())
              print(json.dumps({key: value.get(key) for key in
                  ('status', 'source_head', 'platform', 'image_id', 'error_type')}))
          for name in ('commands.private.log', 'image/build.log'):
              path = Path('.tools/mac-consumer-experiment') / name
              if not path.is_file():
                  continue
              print('Bounded failure diagnostics:', name)
              lines = path.read_text(errors='replace').splitlines()
              for line in lines[-100:]:
                  text = line.casefold()
                  if any(word in text for word in ('token','password','authorization','cookie','secret','private key')):
                      continue
                  if any(word in text for word in ('error','exception','failed','traceback')):
                      print(line[:1000])
          PY
  macos-native-ui:
    # Stock native source, system UI automation; no model/Docker/OS mutation.
    if: inputs.operation == 'macos-native-ui-checks' && github.event.repository.private == false && github.actor == github.repository_owner && github.repository == 'jahu/ai-station'
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Drive actual native windows through Apple UI automation
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -m 700 .native-mac
          mkdir -m 700 .native-mac/ui-acceptance
          # Match the standalone product helper; Xcode's app executable has an
          # Info.plist-bound signature and is not a transplantable helper fixture.
          /usr/bin/xcrun clang -fobjc-arc -fmodules -framework Cocoa \
            -framework UniformTypeIdentifiers -arch x86_64 \
            -mmacosx-version-min=13.3 -Werror=implicit-function-declaration \
            -Werror=return-type packaging/macos/native.m \
            -o "$PWD/.native-mac/ui-acceptance/ai-station-native"
          /usr/bin/xcodebuild test \
            -project packaging/macos/acceptance/NativeAcceptance.xcodeproj \
            -scheme NativeAcceptance -configuration Debug \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -derivedDataPath "$PWD/.native-mac/ui-acceptance/build" \
            -resultBundlePath "$PWD/.native-mac/ui-acceptance/result.xcresult" \
            CODE_SIGN_IDENTITY=-
  macos-desktop-transport:
    # Explicit developer prerequisite install on a fresh standard free public VM.
    # Never run this job on an existing station, a private or a paid runner.
    if: inputs.operation == 'macos-desktop-transport' && github.event.repository.private == false && github.actor == github.repository_owner && github.repository == 'jahu/ai-station'
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed Docker Desktop and test actual native socket and chosen filesystem
        env:
          AI_STATION_REAL_MAC_DOCKER_TESTS: '1'
        run: bash scripts/macos_docker_desktop_qa.sh
      - name: Report the owned bridge receipt if available
        if: always()
        run: |
          if [ -f .native-mac/bridge-proof/result.json ]; then
            cat .native-mac/bridge-proof/result.json
          fi
          if [ -f .native-mac/bridge-tls-proof/result.json ]; then
            cat .native-mac/bridge-tls-proof/result.json
          fi
          if [ -f .native-mac/bridge-native-db-proof/result.json ]; then
            cat .native-mac/bridge-native-db-proof/result.json
          fi
  release-pr:
    if: inputs.operation == 'release-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-pr-master
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or reuse the release PR as github-actions[bot]
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.ref !== 'refs/heads/develop' || context.actor !== owner) {
              throw new Error('Release preparation requires develop and the repository owner.');
            }
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', base: 'master', head: `${owner}:develop`
            });
            if (existing.length) {
              if (existing[0].user.login !== 'github-actions[bot]') {
                throw new Error('Existing release PR has a different author; owner must resolve it first.');
              }
              await core.summary.addLink('Existing release PR', existing[0].html_url).write();
              return;
            }
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner, repo, base: 'master', head: 'develop'
            });
            if (!comparison.files?.length) {
              await core.summary.addRaw('No release changes to propose.').write();
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base: 'master', head: 'develop',
              title: 'Release: promote develop to master',
              body: [
                'Prepared by github-actions[bot] so the human owner can approve this PR.',
                `@${owner} must inspect the full diff and validation before approving and merging.`,
                'Use a merge commit to preserve develop ancestry. No automatic approval, merge, deployment or tagging is performed.',
                'Existing published release tags remain immutable.'
              ].join('\n\n')
            });
            await core.summary.addLink('Release PR for owner review', pr.html_url).write();
