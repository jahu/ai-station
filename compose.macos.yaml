# Trusted native supervisor only; the Mac consumer prerequisite gate stays closed.
# Linux/WSL do not select this overlay. No port is published by the connection.
x-native-client-volumes: &native-client-volumes
  - type: bind
    source: ${AI_STATION_DATA_HOST_PATH:?Choose application data}
    target: /data
    bind:
      create_host_path: false
  - type: volume
    source: native-runner
    target: /runner
    read_only: true
    volume:
      nocopy: true

services:
  ai-station:
    volumes: *native-client-volumes
    depends_on:
      runner-connection:
        condition: service_healthy
  worker:
    volumes: *native-client-volumes
    depends_on:
      runner-connection:
        condition: service_healthy
  scheduler:
    volumes: *native-client-volumes
    depends_on:
      runner-connection:
        condition: service_healthy
  runner-connection:
    image: ${AI_STATION_APP_IMAGE:-ai-station:local}
    user: "${AI_STATION_UID:-1000}:${AI_STATION_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 16
    ulimits:
      nofile: {soft: 128, hard: 128}
    environment:
      AI_STATION_NATIVE_CONNECTION_PORT: ${AI_STATION_NATIVE_CONNECTION_PORT:-0}
    command: [python, -IB, /app/desktop/desktop_connection.py]
    volumes:
      - type: volume
        source: native-runner
        target: /runner
        volume:
          nocopy: true
      - type: bind
        source: ${AI_STATION_NATIVE_CONNECTION_DIR:?Use the supervisor-selected client credentials}
        target: /connection
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -IB, /app/desktop/desktop_connection.py, --health]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s

volumes:
  native-runner:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16777216,uid=${AI_STATION_UID:-1000},gid=${AI_STATION_GID:-1000},mode=0700"
