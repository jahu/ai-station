[project]
name = "ai-station"
version = "0.1.0"
description = "Local-first AI workstation control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "httpx>=0.28",
  "python-multipart>=0.0.17",
  "croniter>=5.0",
  "tzdata==2026.5",
  "pillow>=11.0",
  "pypdf>=5.0",
  "onnxruntime==1.31.0",
  "tokenizers==0.23.3",
  "pyotp==2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "onnx==1.23.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", "../host-runner", "../scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
