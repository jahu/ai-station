use_default_settings:
  engines:
    keep_only: [bing, yahoo]
server:
  limiter: false
  image_proxy: false
search:
  formats: [json]
  safe_search: 1
  autocomplete: ""
outgoing:
  request_timeout: 7.0
  max_request_timeout: 10.0
engines:
  # keep_only does not enable engines disabled in SearXNG's defaults.
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
